log_format honeypot escape=json
  "{\"ts\":\"$time_iso8601\",\"ip\":\"$remote_addr\",\"port\":\"$remote_port\",\"host\":\"$host\","
  "\"sni\":\"$ssl_server_name\",\"tls\":\"$ssl_protocol\",\"cipher\":\"$ssl_cipher\","
  "\"ciphers\":\"$ssl_ciphers\",\"curves\":\"$ssl_curves\",\"req\":\"$request\",\"status\":$status,"
  "\"bytes_in\":$request_length,\"bytes_out\":$body_bytes_sent,\"rt\":$request_time,"
  "\"ua\":\"$http_user_agent\",\"referer\":\"$http_referer\",\"xff\":\"$http_x_forwarded_for\"}";

# --- snippets/llm-honeypot-proxy.conf
access_log /var/log/llm-honeypot/nginx.jsonl honeypot;
client_max_body_size 4m;
location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
location / {
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Honeypot-Scheme $scheme;
    proxy_set_header X-Honeypot-Port $remote_port;
    proxy_set_header X-Honeypot-Local-Port $server_port;
    proxy_set_header X-Honeypot-TLS-Proto $ssl_protocol;
    proxy_set_header X-Honeypot-TLS-Ciphers $ssl_ciphers;
    proxy_set_header X-Honeypot-TLS-Curves $ssl_curves;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_read_timeout 120s;
}

# --- sites-available (one block per bait hostname, plus raw-IP LLM ports)
# llm-honeypot bait vhosts (generated). HTTP + HTTPS per name.
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name llm.example.com;
    ssl_certificate     /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/llm-honeypot-proxy.conf;
}
server {
# Standard self-hosted LLM ports on the raw IP (Ollama, vLLM, LiteLLM, LM Studio, misc).
server {
    listen 11434 default_server; listen [::]:11434 default_server;
    listen 8000 default_server; listen [::]:8000 default_server;
    listen 4000 default_server; listen [::]:4000 default_server;
    listen 1234 default_server; listen [::]:1234 default_server;
    listen 5000 default_server; listen [::]:5000 default_server;
    listen 203.0.113.10:8080 default_server; listen [::]:8080 default_server;
    server_name _;
    include snippets/llm-honeypot-proxy.conf;
}
